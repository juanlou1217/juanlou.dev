name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_HOST: ${{ secrets.PROD_HOST }}
      DEPLOY_USER: ${{ secrets.PROD_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_PATH }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      APP_IMAGE: localhost/juanlou-dev_app:latest
      APP_IMAGE_ARCHIVE: app-image.tar.gz
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
      NEXT_PUBLIC_GISCUS_REPO: ${{ secrets.NEXT_PUBLIC_GISCUS_REPO }}
      NEXT_PUBLIC_GISCUS_REPOSITORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_REPOSITORY_ID }}
      NEXT_PUBLIC_GISCUS_CATEGORY: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY }}
      NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
      UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
      UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing PROD_HOST secret" && exit 1)
          test -n "$DEPLOY_USER" || (echo "Missing PROD_USER secret" && exit 1)
          test -n "${{ secrets.PROD_SSH_KEY }}" || (echo "Missing PROD_SSH_KEY secret" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host *
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Build production image
        run: |
          docker build -t "$APP_IMAGE" .
          docker save "$APP_IMAGE" | gzip -1 > "$APP_IMAGE_ARCHIVE"
          ls -lh "$APP_IMAGE_ARCHIVE"
          sha256sum "$APP_IMAGE_ARCHIVE" > "$APP_IMAGE_ARCHIVE.sha256"

      - name: Store production image
        id: image-artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-image
          path: app-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to server
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.image-artifact.outputs.artifact-id }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/juanlou-dev}"
          POSTGRES_USER="${POSTGRES_USER:-postgres}"
          POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-postgres}"
          POSTGRES_DB="${POSTGRES_DB:-juanlou_blog}"
          POSTGRES_URL="${POSTGRES_URL:-postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB}"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v git >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update && apt-get install -y git
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y git
              else
                yum install -y git
              fi
            fi
            mkdir -p '$DEPLOY_PATH'
            if [ ! -d '$DEPLOY_PATH/.git' ]; then
              git clone --depth 1 'https://github.com/${{ github.repository }}.git' '$DEPLOY_PATH'
            fi
            cd '$DEPLOY_PATH'
            git fetch origin main
            git checkout main
            git reset --hard '${{ github.sha }}'
          "

          artifact_metadata=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          artifact_size=$(jq -r '.size_in_bytes' <<< "$artifact_metadata")
          artifact_digest=$(jq -r '.digest | sub("^sha256:"; "")' <<< "$artifact_metadata")
          artifact_url=$(curl --fail --silent --show-error --output /dev/null --write-out '%{redirect_url}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip")
          test -n "$artifact_url"
          echo "::add-mask::$artifact_url"
          echo 'Downloading and verifying the image using parallel HTTPS ranges'
          printf '%s\n' "$artifact_url" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            timeout 480 python3 scripts/deploy/download-artifact.py '$artifact_size' '$artifact_digest' image-artifact.zip.part
            python3 -c \"import zipfile; zipfile.ZipFile('image-artifact.zip.part').extract('$APP_IMAGE_ARCHIVE', '.')\"
            rm image-artifact.zip.part
          "
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            sha256sum -c -
          " < "$APP_IMAGE_ARCHIVE.sha256"
          echo 'Image download and checksum verification completed'

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env.production'" <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_URL=$POSTGRES_URL
          APP_IMAGE=$APP_IMAGE
          APP_IMAGE_ARCHIVE=$DEPLOY_PATH/$APP_IMAGE_ARCHIVE
          GITHUB_API_TOKEN=$GITHUB_API_TOKEN
          NEXT_PUBLIC_GISCUS_REPO=$NEXT_PUBLIC_GISCUS_REPO
          NEXT_PUBLIC_GISCUS_REPOSITORY_ID=$NEXT_PUBLIC_GISCUS_REPOSITORY_ID
          NEXT_PUBLIC_GISCUS_CATEGORY=$NEXT_PUBLIC_GISCUS_CATEGORY
          NEXT_PUBLIC_GISCUS_CATEGORY_ID=$NEXT_PUBLIC_GISCUS_CATEGORY_ID
          UMAMI_WEBSITE_ID=$UMAMI_WEBSITE_ID
          UMAMI_SHARE_URL=$UMAMI_SHARE_URL
          EOF

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            export APP_DIR='$DEPLOY_PATH'
            cd '$DEPLOY_PATH'
            bash scripts/deploy/remote-bootstrap.sh
          "

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 https://juanlou.top/ -o /dev/null
