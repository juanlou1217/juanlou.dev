name: Inspect Music Integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production without changing services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -eu
          if command -v podman >/dev/null; then runtime=podman; else runtime=docker; fi
          "$runtime" ps --format '{{.Names}} {{.Image}} {{.Status}}'
          "$runtime" network ls --format '{{.Name}}'
          for id in $("$runtime" ps -q); do
            "$runtime" inspect "$id" --format '{{.Name}} networks={{range $name, $value := .NetworkSettings.Networks}}{{$name}} {{end}} mounts={{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}'
          done
          test ! -d /opt/juanlou-infra || git -C /opt/juanlou-infra status --short
          REMOTE
