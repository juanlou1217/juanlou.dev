name: Inspect Music Integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production without changing services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -eu
          podman exec folia_qq-api_1 node -e 'const fs=require("fs");const p="/app/node_modules/@yakult-green-tea/qq-music-api";console.log("PACKAGE",require(p+"/package.json").version);for(const k of ["QQ_AUTH_SESSION_PATH","QQ_AUTH_STATE_PATH","QQ_SESSION_SECRET"]) console.log(k,k.endsWith("SECRET")?Boolean(process.env[k]):process.env[k]);console.log("STATE_FILES",fs.readdirSync("/app/.auth-state"));'
          podman exec folia_qq-api_1 sh -c 'find /app/node_modules/@yakult-green-tea/qq-music-api/dist -type f | grep -E "session|Session|repository|Repository|playlist" | head -45'
          REMOTE
