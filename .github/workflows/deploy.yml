name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_HOST: ${{ secrets.PROD_HOST }}
      DEPLOY_USER: ${{ secrets.PROD_USER }}
      DEPLOY_PATH: ${{ secrets.PROD_PATH }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      APP_IMAGE: localhost/juanlou-dev_app:latest
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
      NEXT_PUBLIC_GISCUS_REPO: ${{ secrets.NEXT_PUBLIC_GISCUS_REPO }}
      NEXT_PUBLIC_GISCUS_REPOSITORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_REPOSITORY_ID }}
      NEXT_PUBLIC_GISCUS_CATEGORY: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY }}
      NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
      UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
      UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing PROD_HOST secret" && exit 1)
          test -n "$DEPLOY_USER" || (echo "Missing PROD_USER secret" && exit 1)
          test -n "${{ secrets.PROD_SSH_KEY }}" || (echo "Missing PROD_SSH_KEY secret" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host *
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Recover production from verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/juanlou-dev}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/download-artifact.py'" < scripts/deploy/download-artifact.py
          artifact_url=$(curl --fail --silent --show-error --output /dev/null --write-out '%{redirect_url}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/11599321593/zip")
          test -n "$artifact_url"
          echo "::add-mask::$artifact_url"
          printf '%s\n' "$artifact_url" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            pkill -TERM -f '^podman build --layers -t localhost/juanlou-dev_app:latest [.]$' || true
            timeout 480 python3 download-artifact.py 109425534 34443b46de1d235d82c8ec132a9458cc21695b1121ab73d9c2dfd33da0a309a6 recovered-image.zip
            python3 -c \"import zipfile; zipfile.ZipFile('recovered-image.zip').extract('app-image.tar.gz', '.')\"
            test -f .env.production
            sed -i 's|^APP_IMAGE_ARCHIVE=.*|APP_IMAGE_ARCHIVE=$DEPLOY_PATH/app-image.tar.gz|' .env.production
            export APP_DIR='$DEPLOY_PATH'
            bash scripts/deploy/remote-bootstrap.sh
          "

      - name: Verify published article
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 https://juanlou.top/blog/family-face-personal-cost -o /tmp/article.html
          grep -q '面子是全家的' /tmp/article.html
